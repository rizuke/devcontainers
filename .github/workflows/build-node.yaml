name: build/node

on:
  push:
    branches:
      - main
    paths:
      - images/node/**
      - .github/workflows/build-node.yaml

  schedule:
    - cron: "0 3 * * 6"

  workflow_dispatch:

jobs:
  build-and-push:
    uses: rizuke/.github/.github/workflows/build-docker-image.yaml@main
    with:
      image-name: node
      context: ./images/node
      dockerfile: ./images/node/Dockerfile
      multi-arch: true
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      packages: write
